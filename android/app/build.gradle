plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.new01" // Ensure this matches your app's name
    compileSdk = flutter.compileSdkVersion  // Ensure this is set in your Flutter SDK

    ndkVersion = flutter.ndkVersion // Make sure it's set correctly

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17" // Set JVM target to 17
    }



    defaultConfig {
        applicationId = "com.example.new01" // Ensure the application ID matches your namespace
        minSdk = 21  // Ensure this is set in your Flutter project
        targetSdk = flutter.targetSdkVersion  // Ensure this is set in your Flutter project
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // Add your own signing config for the release build
            signingConfig = signingConfigs.debug  // Modify as needed for production build
        }
    }
}

flutter {
    source = "../.."  // Ensure this path is correct relative to your Flutter project
}
